name: Build Dev Client APK

# Run this ONCE (or when you add/remove a native package), install the APK,
# then develop live with:  npx expo start --dev-client
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Generate native code (prebuild)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build debug (dev client) APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleared-dev-client
          path: android/app/build/outputs/apk/debug/app-debug.apk